<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>口语积累本 · Vocabulary</title>
<style>
  :root {
    --bg: #f6f4ef;
    --card: #ffffff;
    --ink: #2b2a27;
    --sub: #6b675e;
    --accent: #3563e9;
    --border: #e4e0d5;
    --phon: #8a6d3b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #191816; --card: #232220; --ink: #eae7df; --sub: #a39e92;
      --accent: #7aa2f7; --border: #37352f; --phon: #c9a86a;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: 24px 16px 60px;
    max-width: 860px; margin: 0 auto;
  }
  header { text-align: center; margin-bottom: 24px; }
  header h1 { font-size: 26px; letter-spacing: 1px; }
  header p { color: var(--sub); font-size: 13px; margin-top: 6px; }
  ul#word-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
  li.entry {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; overflow: hidden;
    box-shadow: 0 1px 3px rgba(0,0,0,.04);
  }
  .entry-main {
    display: flex; align-items: center; gap: 12px;
    padding: 13px 16px;
  }
  .num { color: var(--sub); font-size: 12px; min-width: 26px; font-variant-numeric: tabular-nums; }
  .word { font-size: 17px; font-weight: 600; flex: 1; word-break: break-word; }
  button.toggle {
    border: 1px solid var(--border); background: transparent; color: var(--accent);
    font-size: 13px; padding: 5px 14px; border-radius: 999px; cursor: pointer;
    flex-shrink: 0; transition: background .15s;
  }
  button.toggle:hover { background: rgba(53,99,233,.08); }
  .detail {
    display: none; border-top: 1px dashed var(--border);
    padding: 12px 16px 14px 54px; font-size: 15px; line-height: 1.75;
  }
  li.entry.open .detail { display: block; }
  li.entry.open button.toggle { background: var(--accent); color: #fff; border-color: var(--accent); }
  .detail .phon { color: var(--phon); font-size: 14px; }
  .detail .mean { margin-top: 2px; }
  .detail .ex { margin-top: 6px; color: var(--sub); font-style: italic; }
  @media (max-width: 560px) {
    .detail { padding-left: 16px; }
    .word { font-size: 16px; }
  }
  /* ── 抽查模式 ── */
  .mode-bar { display: flex; justify-content: center; gap: 8px; margin-top: 14px; }
  .mode-btn {
    border: 1px solid var(--border); background: var(--card); color: var(--sub);
    font-size: 14px; padding: 6px 22px; border-radius: 999px; cursor: pointer;
  }
  .mode-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  #quiz-view { max-width: 520px; margin: 0 auto; }
  .quiz-progress { text-align: center; color: var(--sub); font-size: 14px; margin-bottom: 14px; }
  .quiz-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    padding: 34px 24px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,.05);
  }
  .quiz-word { font-size: 30px; font-weight: 700; word-break: break-word; }
  .quiz-detail {
    margin-top: 16px; font-size: 16px; line-height: 1.8; text-align: left;
    border-top: 1px dashed var(--border); padding-top: 14px;
  }
  .quiz-detail .phon { color: var(--phon); font-size: 15px; }
  .quiz-detail .ex { color: var(--sub); font-style: italic; }
  .quiz-btns { display: flex; justify-content: center; gap: 14px; margin-top: 26px; }
  .q-btn {
    font-size: 16px; padding: 10px 30px; border-radius: 12px; cursor: pointer;
    border: 1px solid var(--border); background: var(--card); color: var(--ink);
  }
  .q-btn.know { border-color: #2e9e5b; color: #2e9e5b; }
  .q-btn.know:hover { background: rgba(46,158,91,.12); }
  .q-btn.unknow { border-color: #d05a5a; color: #d05a5a; }
  .q-btn.unknow:hover { background: rgba(208,90,90,.12); }
  .q-btn.next { background: var(--accent); border-color: var(--accent); color: #fff; }
  .quiz-result { text-align: center; }
  .quiz-result h2 { margin-bottom: 10px; }
  .quiz-result p { color: var(--sub); margin-bottom: 16px; }
  #q-wrong-list { list-style: none; text-align: left; display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
  #q-wrong-list li { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; font-size: 14px; }
  #q-wrong-list .w { font-weight: 600; }
  #q-wrong-list .m { color: var(--sub); margin-top: 2px; }
  /* ── 错题本模式 ── */
  .nb-actions { text-align: center; margin-bottom: 14px; }
  .nb-empty { text-align: center; color: var(--sub); padding: 40px 0; font-size: 15px; }
  .nb-count {
    background: rgba(208,90,90,.12); color: #d05a5a; font-size: 12px;
    padding: 2px 10px; border-radius: 999px; flex-shrink: 0;
  }
  /* ── 添加词语：按钮与弹窗 ── */
  .add-btn {
    border: 1px solid var(--accent); background: transparent; color: var(--accent);
    font-size: 14px; padding: 6px 18px; border-radius: 999px; cursor: pointer;
  }
  .add-btn:hover { background: rgba(53,99,233,.08); }
  .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; z-index: 50; }
  .modal { background: var(--card); color: var(--ink); border: 1px solid var(--border); border-radius: 14px; padding: 22px; width: min(430px, 92vw); box-shadow: 0 8px 30px rgba(0,0,0,.25); }
  .modal h2 { font-size: 17px; }
  .modal .sub { color: var(--sub); font-size: 12px; line-height: 1.6; margin: 6px 0 4px; }
  .modal label { display: block; font-size: 13px; color: var(--sub); margin: 12px 0 4px; }
  .modal input { width: 100%; font-size: 15px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--ink); }
  .m-btns { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
  .lookup-row { display: flex; gap: 8px; }
  .lookup-row input { flex: 1; }
  #lookup-btn { flex-shrink: 0; font-size: 13px; padding: 6px 14px; border-radius: 8px; }
  #add-p.autofill, #add-m.autofill, #add-e.autofill { outline: 2px solid rgba(53,99,233,.35); }
  /* ── 抽查页脚 + 提示条 ── */
  .quiz-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; max-width: 520px; margin: 12px auto 0; color: var(--sub); font-size: 13px; }
  .quiz-foot .q-btn { font-size: 13px; padding: 6px 14px; border-radius: 999px; }
  .q-btn.danger { border-color: #d05a5a; color: #d05a5a; }
  #toast { position: fixed; left: 50%; bottom: 36px; transform: translateX(-50%); background: var(--ink); color: var(--bg); font-size: 14px; padding: 10px 18px; border-radius: 999px; opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 60; max-width: 86vw; }
  .quiz-cat { display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 12px; border-radius: 999px; margin-bottom: 12px; }
  .quiz-cat.new { background: rgba(53,99,233,.12); color: var(--accent); }
  .quiz-cat.wrong { background: rgba(208,90,90,.12); color: #d05a5a; }
  #toast.show { opacity: .95; }
</style>
</head>
<body>
<header>
  <h1>口语积累本</h1>
  <p id="count"></p>
  <div class="mode-bar">
    <button class="mode-btn active" data-mode="list">列表</button>
    <button class="mode-btn" data-mode="quiz">抽查</button>
    <button class="mode-btn" data-mode="notebook">错题本</button>
    <button class="add-btn" id="btn-add">＋ 添加词语</button>
  </div>
</header>
<ul id="word-list"></ul>
<div id="quiz-view" hidden></div>
<div id="notebook-view" hidden></div>

<!-- 添加词语弹窗 -->
<div class="modal-mask" id="add-mask" hidden>
  <div class="modal">
    <h2>＋ 添加词语</h2>
    <div class="sub">输入单词点「查字典」自动填充音标、释义、例句，确认后写入（存本浏览器，周五更新不丢失）· 已存在的词不会重复添加</div>
    <label>单词 / 短语 *</label>
    <div class="lookup-row">
      <input id="add-w" type="text" placeholder="如：hang out">
      <button class="q-btn next" id="lookup-btn">查字典</button>
    </div>
    <label>音标（自动填充，可改）</label><input id="add-p" type="text" placeholder="点「查字典」或手动填写">
    <label>词性 + 中文（自动填充，可改）</label><input id="add-m" type="text" placeholder="点「查字典」或手动填写">
    <label>例句 / 短语（自动填充，可改）</label><input id="add-e" type="text" placeholder="点「查字典」或手动填写">
    <div class="m-btns">
      <button class="q-btn" id="add-cancel">取消</button>
      <button class="q-btn next" id="add-save">保存</button>
    </div>
  </div>
</div>

hat friendship is all about. 这就是友谊的真谛。"}, {"w": "plus", "p": "/plʌs/", "m": "prep./adj. 此外；加上；正的", "e": "The house is big, plus it has a garden. 房子很大，此外还有一座花园。"}, {"w": "spreadsheet", "p": "/ˈspredʃiːt/", "m": "n. 电子表格；空白表格程序", "e": "I use a spreadsheet to track my daily expenses. 我用电子表格来记录日常开销。"}, {"w": "from now until the end of something", "p": "/frəm naʊ ənˈtɪl ði end ɒv ˈsʌmθɪŋ/", "m": "短语：从现在直到某事结束", "e": "From now until the end of the project, we will work together. 从现在直到项目结束，我们将一起工作。"}, {"w": "idiom", "p": "/ˈɪdiəm/", "m": "n. 习语，成语", "e": "\"Cut sb some slack\" is a common English idiom. “对某人宽容些” 是一个常用英语习语。"}, {"w": "kick things off", "p": "/kɪk θɪŋz ɒf/", "m": "习语：开启；启动；拉开序幕", "e": "Let's kick things off with a short speech. 我们以简短发言拉开序幕。"}, {"w": "while I am here", "p": "/waɪl aɪ æm hɪə(r)/", "m": "句型：趁我在这儿；既然我来了", "e": "While I am here, I will finish the task. 趁我在这儿，我会把任务完成。"}, {"w": "even though", "p": "/ˈiːvn ðəʊ/", "m": "连词：虽然，尽管", "e": "Even though it rained, we still went out. 尽管下雨，我们还是出去了。"}, {"w": "be detrimental to somebody", "p": "/bi ˌdetrɪˈmentl tu ˈsʌmbədi/", "m": "短语：对某人有害", "e": "Smoking is detrimental to your health. 吸烟对你身体有害。"}, {"w": "be upsetting to somebody", "p": "/bi ʌpˈsetɪŋ tu ˈsʌmbədi/", "m": "短语：令某人心烦 / 难过", "e": "Your words are upsetting to her. 你的话让她很难过。"}, {"w": "do the best for somebody", "p": "/duː ðə best fɔː(r) ˈsʌmbədi/", "m": "短语：为某人做到最好", "e": "Parents always do the best for their kids. 父母总是为孩子做到最好。"}, {"w": "intention", "p": "/ɪnˈtenʃn/", "m": "n. 意图，目的，打算", "e": "I have no intention of hurting you. 我无意伤害你。"}, {"w": "I am doing great", "p": "/aɪ æm ˈduːɪŋ ɡreɪt/", "m": "口语句型：我过得很好；我状态很不错", "e": "—How are you? —I am doing great.—— 你还好吗？—— 我状态很好。"}, {"w": "selling point", "p": "/ˈselɪŋ pɔɪnt/", "m": "n. 卖点；销售特色", "e": "Low price is its main selling point. 价格低廉是它的主要卖点。"}, {"w": "nonstop schedule", "p": "/ˈnɒnstɒp ˈʃedjuːl/", "m": "短语：排满的日程；连轴转的安排", "e": "He has a nonstop schedule every week. 他每周日程排得满满当当。"}, {"w": "around the clock", "p": "/əˈraʊnd ðə klɒk/", "m": "短语：夜以继日；全天候", "e": "The shop serves customers around the clock. 这家店铺全天候接待顾客。"}, {"w": "twenty four seven", "p": "/ˌtwenti fɔː ˈsevən/", "m": "短语：全天候；昼夜不停", "e": "We offer support twenty four seven. 我们提供 7×24 小时服务。"}, {"w": "a mix of", "p": "/ə mɪks ɒv/", "m": "短语：…… 的混合；兼具", "e": "It is a mix of joy and sorrow. 这是喜忧参半。"}, {"w": "hopefully", "p": "/ˈhəʊpfəli/", "m": "adv. 但愿；有望", "e": "Hopefully, we can finish on time. 但愿我们能按时完成。"}, {"w": "slack", "p": "/slæk/", "m": "adj./n. 松弛；懈怠；空闲", "e": "Don’t be slack in your work. 工作不要懈怠。"}, {"w": "have in store for", "p": "/hæv ɪn stɔː fɔː(r)/", "m": "短语：即将发生；等待着", "e": "Who knows what the future has in store for us. 谁知道未来在等待我们什么。"}, {"w": "stay in shape", "p": "/steɪ ɪn ʃeɪp/", "m": "短语：保持身材；保持健康", "e": "I exercise every day to stay in shape. 我每天锻炼保持身材。"}, {"w": "show up", "p": "/ʃəʊ ʌp/", "m": "短语：出现；露面；到场", "e": "Please show up on time. 请准时到场。"}, {"w": "grumpy", "p": "/ˈɡrʌmpi/", "m": "adj. 脾气暴躁的；爱发脾气的", "e": "He gets grumpy when he is tired. 他累的时候就会脾气暴躁。"}, {"w": "inclined", "p": "/ɪnˈklaɪnd/", "m": "adj. 倾向于；有… 的倾向；倾斜的", "e": "I am inclined to agree with you. 我倾向于同意你的观点。"}, {"w": "to excess", "p": "/tu ɪkˈses/", "m": "短语：过度；过量；过分", "e": "Don’t drink alcohol to excess. 饮酒不要过量。"}, {"w": "for the reason of", "p": "/fɔː ðə ˈriːzn ɒv/", "m": "短语：由于；因为；出于…… 的原因", "e": "He left early for the reason of illness. 他因为生病提前离开了。"}, {"w": "from scratch", "p": "/frəm skrætʃ/", "m": "短语：从零开始；白手起家；从头做起", "e": "She built the company from scratch. 她白手起家创办了这家公司。"}, {"w": "in one's diet", "p": "/ɪn wʌnz ˈdaɪət/", "m": "短语：在某人的日常饮食中；饮食里", "e": "We should include more vegetables in our diet. 我们应该在日常饮食中多摄入蔬菜。"}, {"w": "if I can help it", "p": "/ɪf aɪ kæn help ɪt/", "m": "句式：除非不得已；只要有可能；尽量不做某事", "e": "I won't go out if I can help it. 只要能不去，我就不出门。"}, {"w": "occasionally", "p": "/əˈkeɪʒənəli/", "m": "adv. 偶尔；间或；有时候", "e": "I go to the gym occasionally. 我偶尔去健身房。"}, {"w": "around the corner", "p": "/əˈraʊnd ðə ˈkɔːnə(r)/", "m": "短语：即将来临；在拐角处", "e": "The holiday is around the corner. 假期即将到来。"}, {"w": "refine", "p": "/rɪˈfaɪn/", "m": "v. 精炼；提纯；改进；完善；使文雅", "e": "We need to refine our plan. 我们需要完善我们的计划。"}, {"w": "say that", "p": "/seɪ ðæt/", "m": "动词短语：如果说；也就是说；那样说", "e": "Say that you are right, what should we do next? 如果说你是对的，那我们接下来该怎么做？"}, {"w": "have a word with somebody", "p": "/hæv ə wɜːd wɪð ˈsʌmbədi/", "m": "动词短语：和某人说几句话；与某人私下交谈", "e": "I want to have a word with you after class. 课后我想和你聊几句。"}, {"w": "have words with somebody", "p": "/hæv wɜːdz wɪð ˈsʌmbədi/", "m": "动词短语：和某人争吵；吵架", "e": "He had words with his deskmate yesterday. 他昨天和同桌吵架了。"}, {"w": "give somebody a hard time", "p": "/ɡɪv ˈsʌmbədi ə hɑːd taɪm/", "m": "动词短语：刁难某人；给某人找麻烦；让某人不好过", "e": "Don't give him a hard time. 别刁难他。"}, {"w": "turn up to do something", "p": "/tɜːn ʌp tu duː ˈsʌmθɪŋ/", "m": "动词短语：到场做某事；出现去做某事", "e": "He turned up to attend the meeting on time. 他准时到场参加会议。"}, {"w": "We are in the same boat.", "p": "/wiː ɑː(r) ɪn ðə seɪm bəʊt/", "m": "习语：我们处境相同；同舟共济", "e": "Don't worry, we are in the same boat. 别担心，我们处境一样。"}, {"w": "calm down", "p": "/kɑːm daʊn/", "m": "动词短语：冷静下来；平静下来", "e": "Please calm down and listen to me. 请冷静下来听我说。"}, {"w": "make it up", "p": "/meɪk ɪt ʌp/", "m": "动词短语：和解；和好；弥补；编造", "e": "They argued but later made it up. 他们吵了一架，后来和好了。"}, {"w": "time off", "p": "/taɪm ɒf/", "m": "名词短语：休假；休息时间；请假", "e": "I need some time off next week. 我下周需要请几天假。"}, {"w": "an extension on", "p": "/ən ɪkˈstenʃn ɒn/", "m": "名词短语：（期限）延期", "e": "She applied for an extension on the project. 她申请项目延期。"}, {"w": "initially", "p": "/ɪˈnɪʃəli/", "m": "adv. 副词：最初；起初；开始", "e": "I initially disagreed with his idea. 我起初不认同他的想法。"}, {"w": "despite", "p": "/dɪˈspaɪt/", "m": "prep. 介词：尽管；虽然；不顾", "e": "He went out despite the heavy rain. 尽管下大雨，他还是出去了。"}, {"w": "be misinterpreted", "p": "/bi ˌmɪsɪnˈtɜːprɪtɪd/", "m": "被动动词短语：被误解；被曲解", "e": "Your words might be misinterpreted by others. 你的话有可能被别人曲解。"}, {"w": "grumpy", "p": "/ˈɡrʌmpi/", "m": "adj. 形容词：脾气暴躁的；爱发脾气的", "e": "He is grumpy when he gets tired. 他累的时候就爱发脾气。"}, {"w": "approach somebody", "p": "/əˈprəʊtʃ ˈsʌmbədi/", "m": "动词短语：主动接近某人；找某人沟通；接洽某人", "e": "You can approach him for help. 你可以找他寻求帮助。"}, {"w": "compound", "p": "/ˈkɒmpaʊnd/(n./adj.)；/kəmˈpaʊnd/(v.)", "m": "n. 复合物；化合物；大院 adj. 复合的 v. 使恶化，加重", "e": "Stress can compound your health problems. 压力会加重你的健康问题。"}, {"w": "fester", "p": "/ˈfestə(r)/", "m": "v. 动词：溃烂；（矛盾）恶化、愈演愈烈", "e": "Don’t let the conflict fester. 别让矛盾不断激化。"}, {"w": "bicker", "p": "/ˈbɪkə(r)/", "m": "v. 动词：（小事）争吵，拌嘴，口角", "e": "They often bicker over small things. 他们经常为鸡毛蒜皮的小事拌嘴。"}, {"w": "tumor", "p": "/ˈtjuːmə(r)/", "m": "n. 名词：肿瘤；肿块", "e": "The doctor found a small tumor. 医生发现了一个小肿瘤。"}, {"w": "disagreement", "p": "/ˌdɪsəˈɡriːmənt/", "m": "n. 名词：分歧；意见不合；争论", "e": "We had a minor disagreement about the plan. 我们在这个计划上有一点小分歧。"}, {"w": "on holiday", "p": "/ɒn ˈhɒlədeɪ/", "m": "介词短语：在度假；休假中（英式）", "e": "My parents are on holiday in Spain. 我的父母正在西班牙度假。"}, {"w": "as a whole", "p": "/æz ə həʊl/", "m": "介词短语：作为整体；就整体而言", "e": "The team as a whole performed well. 这支队伍整体表现不错。"}, {"w": "on the whole", "p": "/ɒn ðə həʊl/", "m": "介词短语：总的来说；大体上", "e": "On the whole, I’m satisfied with the result. 总的来说，我对结果还算满意。"}, {"w": "strangle", "p": "/ˈstræŋɡl/", "m": "v. 动词：勒死；扼杀，压制", "e": "Too much control will strangle creativity. 过度管控会扼杀创造力。"}, {"w": "stagger", "p": "/ˈstæɡə(r)/", "m": "v. 蹒跚摇晃；使震惊；错开 adj. 错开的", "e": "He staggered out of the room. 他摇摇晃晃走出房间。"}, {"w": "languish", "p": "/ˈlæŋɡwɪʃ/", "m": "v. 受煎熬；日渐衰弱；被忽视埋没", "e": "Many talents languish for lack of opportunity. 许多人才因缺少机会而被埋没。"}, {"w": "going‑away present", "p": "/ˌɡəʊɪŋ‑əˈweɪ ˈpreznt/", "m": "名词短语：临别 / 送别礼物；多用于同事离职、搬家、长期远行，为离开原有环境准备，仪式感较强；区别：goodbye gift 多用于普通短暂分别，场景更随意", "e": "We bought him a going‑away present before he moved abroad. 在他移居国外前，我们给他买了一份送别礼物。"}, {"w": "goodbye gift", "p": "/ˌɡʊdˈbaɪ ɡɪft/", "m": "名词短语：告别礼物；多用于短期分别、普通道别；对比：going‑away present 侧重离职、搬家、长期离开原有生活圈子，仪 el like +verb-ing/动词-ing", "p": "aɪ fiːl laɪk", "m": "句型:feel like+v.-ing 表想要  想要做某事", "e": "I feel like going shopping.我想去购物"}, {"w": "I was busy +verb-ing/动词-ing", "p": "aɪ wəz ˈbɪzi", "m": "句型:be busy+v.-ing 表忙于  忙于做某事", "e": "I was busy talking with my boss.那时候我正忙着跟老板谈话"}, {"w": "I want you to +verb/动词", "p": "aɪ wɒnt juː tuː", "m": "句型:want sb to v 表要求  要求/希望对方做。", "e": "I want you to pick me up.我要你来接我"}, {"w": "I have something ______.", "p": "aɪ hæv ˈsʌmθɪŋ", "m": "句型:have something+... 表有某物/事  有某物或某事", "e": "I have something to help your headache.我有办法可以治你的头痛"}, {"w": "I should have +past participle +过去分词", "p": "aɪ ʃʊd hæv", "m": "句型:should have+pp 表本应  过去本应做而未做。", "e": "I should have bought a ticket.我原本应该买下那张票"}, {"w": "I wish I could +verb/动词", "p": "aɪ wɪʃ aɪ kʊd", "m": "句型:wish+could+v 表希望  希望现在/将来能。", "e": "I wish I could join the meeting.我希望自己能够参加此次会议"}, {"w": "I bet _____ .", "p": "aɪ bet", "m": "句型:I bet+句 表肯定  我敢肯定/打赌。", "e": "I bet there will be a traffic jam.我敢肯定 这里即将出现交通拥堵的情况"}, {"w": "I cannot wait to +verb/动词", "p": "aɪ kəˈnɒt weɪt tuː", "m": "句型:cannot wait to v 表迫不及待  迫不及待做某事。", "e": "I cannot wait to get to the beach.我等不及要去海滩了"}, {"w": "I have no idea _____.", "p": "aɪ hæv nəʊ aɪˈɪdə", "m": "句型:I have no idea+从句 表不知  完全不知道。", "e": "I have no idea where he went.我不知道他去了哪。"}, {"w": "I have got to +verb/动词", "p": "aɪ hæv ɡɒt tuː", "m": "句型:have got to v 表必须  必须/不得不做。", "e": "I have got to be home by 9pm.我得以在九点之前回到家"}, {"w": "I wonder if _____?", "p": "aɪ ˈwʌndə ɪf", "m": "句型:I wonder if+句 表想知道  想知道是否。", "e": "I wonder if I can afford a BMW?我想知道自己是否能买得起一台宝马汽车"}, {"w": "I would rather ____ than____.", "p": "aɪ wʊd ˈrɑːðə θæn", "m": "句型:would rather A than B 表宁愿  宁愿A也不B。", "e": "I would rather take the subway than ride the bus.我宁愿去坐地铁也不要坐公共汽车"}, {"w": "I've been +verb-ing/动词-ing", "p": "aɪv bɪn", "m": "句型:have been+v-ing 表持续  一直/近期在做。", "e": "I have been thinking about changing jobs.我一直在考虑换工作的事情"}, {"w": "I've decided to +verb/动词", "p": "aɪv dɪˈsaɪ w": "But this doesn't mean that +subject+verb +主词+动词", "p": "bʌt ðɪs ˈdʌzənt miːn ðæt", "m": "句型:doesn't mean that+S+V  但这并不意味着", "e": "But this doesn't mean that you can eat it.但是这并不表示你就可以吃了它"}, {"w": "By the way, ______. /?", "p": "baɪ ðə weɪ", "m": "句型:By the way  顺便说一下", "e": "By the way, do you have any gum?顺便问一下 你有口香糖吗"}, {"w": "Compared to +noun/名词", "p": "kəmˈpɛrd tuː", "m": "句型:Compared to+n.  与……相比", "e": "Compared to English, Chinese is more difficult.英语和汉语相比 汉语还是更难一些"}, {"w": "Don't ever +verb/动词", "p": "doʊnt ˈevə", "m": "句型:Don't ever+verb  千万别……", "e": "Don't ever buy a new car.千万别买新车"}, {"w": "Even though ______.", "p": "ˈiːvən ðoʊ", "m": "句型:Even though+...  让步，虽然/即使", "e": "Even though I have no job I'm still happy.虽然我没有工作 但是我依旧很快乐"}, {"w": "How are you +verb-ing/动词-ing?", "p": "haʊ ɑːr juː", "m": "句型:How are you+V-ing?  询问方式或打算，口语常用", "e": "How are you going to get there?你打算怎么去那儿"}, {"w": "How do you +verb/动词？", "p": "haʊ duː juː", "m": "句型:How do you+verb  你如何……", "e": "How do you know each other?你们之间是怎么认识的"}, {"w": "How much +verb/动词？", "p": "haʊ mʌtʃ", "m": "句型:How much+v. 表数量/金额  询问数量或金额", "e": "How much does the job pay?这份工作的薪资是多少"}, {"w": "How often do/does _____?", "p": "haʊ ˈɔːfən duː dʌz", "m": "句型:How often+do/does+...?  询问频率，多久一次", "e": "How often do you travel for business?你多久出差一次"}, {"w": "How long does it take to +verb/动词?", "p": "haʊ lɔːŋ dʌz ɪt teɪk tuː", "m": "句型:How long does it take to+V?  询问花多长时间", "e": "It's no use waking up so early.开车去上班要花多少时间"}, {"w": "Is it +adjective/形容词？", "p": "ɪz ɪt", "m": "句型:Is it+adj?  询问是否如此/怎么样", "e": "Is it far from here?它离这儿远吗？"}, {"w": "If it hadn't been for _____.", "p": "ɪf ɪt həðənt bɪn fɔːr", "m": "句型:If it hadn't been for+...  虚拟语气，要不是……", "e": "If it hadn't been for my coach, I would have given up.要不是我的教练 我肯定早就放弃了"}, {"w": "It's too bad that +subject/主词", "p": "ɪts tuː bæd ðæt", "m": "句型:It's too bad that+...  表示遗憾，太可惜了", "e": "It's too bad that he got fired.他被解雇真是太可惜了"}, {"w": "It's my fault for +verb-ing/动词-ing", "p": "ɪts maɪ fɔːlt fɔːr", "m": "句型:It's my fault for+v-ing 表自责  因做某事而怪自己", "e": "It's my fault for being late.迟到是我的错"}, {"w": "It's very kind of you to +verb/动词", "p": "ɪts ˈveri kaɪnd əv juː tuː", "m": "句型:It's very kind of you to+V  感谢对方，你真好心", "e": "It's very kind of you to pay for everything.您真的是个好人 替我们支付了全部的费用"}, {"w": "It's a little _____ .", "p": "ɪts ə ˈlɪtl", "m": "句型:It's a little+...  表示程度稍有些", "e": "It's a little too big for me.对我来说 它有点儿太大了"}, {"w": "It's up to +subject/主词", "p": "ɪts ʌp tuː", "m": "句型:It's up to+n. 表由人决定  由某人决定或负责", "e": "It's up to mom where we eat.吃饭的地方就让妈妈来做决定吧"}, {"w": "It may surprise you, but +subject+verb +主词+动词", "p": "ɪt meɪ sərˈpraɪz juː bʌt", "m": "句型:It may surprise you, but+...  转折，可能让你惊讶", "e": "It may surprise you, but she is blind.也许这会让你感到惊讶 但她是位盲人"}, {"w": "It looks like ______ .", "p": "ɪt lʊks laɪk", "m": "句型:It looks like+句 表看起来  看起来像，似乎", "e": "It looks like she's into you.她似乎喜欢你"}, {"w": "It takes +time/时间 to +verb/动词", "p": "ɪt teɪks tuː", "m": "句型:It takes+time+to v. 表花费  花费时间做某事", "e": "It takes 1 hour to exercise properly.我用了一个小时以正确的方式锻炼身体"}, {"w": "It's no use +verb-ing/动词-ing", "p": "ɪts noʊ juːs", "m": "句型:It's no use+v-ing 表无用  做某事没有用", "e": "It's not use waking up so early.这么早醒过来没有用"}, {"w": "It's time to +verb/动词", "p": "ɪts taɪm tuː", "m": "句型:It's time to+v. 表该做  该做某事了", "e": "It's time to eat dinner.晚餐的时间到了"}, {"w": "No matter what, ______.", "p": "noʊ ˈmætər wʌt", "m": "句型:No matter what+句 表无论  无论如何都", "e": "No matter what, we need to arrive by 7am.不论如何 我们都要在七点钟之前抵达"}, {"w": "No wonder _______ .", "p": "noʊ ˈwʌndər", "m": "句型:No wonder+句 表难怪  难怪，怪不得", "e": "No wonder she was so tired this morning.难怪今天早上她这么累"}, {"w": "Now that I think about it, _______ .", "p": "naʊ ðæt aɪ θɪŋk əˈbaʊt ɪt", "m": "句型:Now that I think about it+句 表回想  现在回想起来", "e": "Now that I think about it, that shirt was too expensive.现在我想起来 当时那件T恤衫确实太贵了"}, {"w": "Once you +verb/动词", "p": "wʌns juː", "m": "句型:Once you+verb 表一旦  一旦你+动词，表条件", "e": "Once you open a bag of cookies, you can't stop eating them.一旦你打开那袋饼干 你肯定会吃个不停"}, {"w": "Please make sure that +subject+verb +主词+动词", "p": "pliːz meɪk ʃʊr ðæt", "m": "句型:Please make sure that+主语+动词 表确保  请确保…", "e": "Please make sure that you call before 3pm.请确认 你会在下午三点之前给我打电话"}, {"w": "Should I +verb/动词？", "p": "ʃʊd aɪ", "m": "句型:Should I+verb? 表询问  我应该…吗？", "e": "Should I ask her out?我应该找她约会吗"}, {"w": "Shouldn't we +verb/动词?", "p": "ˈʃʊdnt wiː", "m": "句型:Shouldn't we+verb? 表建议  我们不是应该…吗？", "e": "Shouldn't we ask the teacher?我们应该问一下老师吗"}, {"w": "Speaking of +subject/主语？", "p": "ˈspiːkɪŋ əv", "m": "句型:Speaking of+主语 表说到  说到…？", "e": "Speaking of TV shows, have you seen 2 Broke Girls?说到电视剧 你有没有看过 电视剧《破产女孩》"}, {"w": "Thanks to +subject/主语?", "p": "θæŋks tə", "m": "句型:Thanks to+主语 表多亏  多亏/谢谢+主语", "e": "Thanks to dad, we've found our dog.谢谢爸爸 咱家的狗已经找到了"}, {"w": "That's why +subject+verb +主语+动词", "p": "ðæts waɪ", "m": "句型:That's why+主语+动词 表原因  这就是…的原因", "e": "That's why Tom Cruise is the best actor.这就是汤姆克鲁思是最佳男演员的原因"}, {"w": "The first thing I'm going to do ___ is ___ .", "p": "ðə fɜːst θɪŋ aɪm ˈɡoʊɪŋ tə duː ɪz", "m": "句型:The first thing I'm going to do is... 表第一件事  我要做的第一件事是…", "e": "The first thing I'm going to do when I get to Italy is eat pasta.我在意大利要做的第一件事情 就是去品尝意大利面"}, {"w": "The more _____ the more _____.", "p": "ðə mɔː ðə mɔː", "m": "句型:the more...the more... 表递进  表示越……越……", "e": "The more I study Chinese the more I enjoy it.汉语学得越深入 越是让我乐在其中"}, {"w": "There is nothing as ____ as____.", "p": "ðɛr ɪz ˈnʌθɪŋ æz æz", "m": "句型:There is nothing as+adj.+as+n.  没有什么比……更……", "e": "There is nothing as good as mom's cooking.没什么东西能与妈妈做的饭相提并论"}, {"w": "There is something wrong with +noun/名词", "p": "ðɛr ɪz ˈsʌmθɪŋ rɔːŋ wɪð", "m": "句型:There is something wrong with+n. 表有问题  …有问题", "e": "There is something wrong with the pasta.这个意大利面有问题"}, {"w": "There is nothing I like better than +noun/名词", "p": "ðɛr ɪz ˈnʌθɪŋ aɪ lak ˈbɛtər ðæn", "m": "句型:There is nothing I like better than+n. 表最喜欢  我最喜欢…", "e": "There is nothing I like better than ice cream in the summer.在夏天 我最喜欢的就是冰淇淋"}, {"w": "There's no way ______.", "p": "ðɛrz noʊ weɪ", "m": "句型:There's no way+clause  根本不可能……", "e": "There's no way I can come.我不可能来了"}, {"w": "There's no need to +verb/动词", "p": "ðɛrz noʊ niːd tuː", "m": "句型:There's no need to+v.  没有必要做……", "e": "There's no need to give it back.没有必要还给我了"}, {"w": "What do you think about _____ ?", "p": "wʌt du ju θɪŋk əˈbaʊt", "m": "句型:What do you think about+n./doing?  你觉得……怎么样？", "e": "What do you think about seeing The Avengers?(一起)去看电影《复仇者联盟》你意下如何"}, {"w": "Why don't we +verb/动词?", "p": "waɪ doʊnt wi", "m": "句型:Why don't we+v?  我们为什么不……？", "e": "Why don't we go see it tomorrow?明天 我们为什么不去看呢"}, {"w": "We'd better +verb/动词", "p": "wiːd ˈbɛtər", "m": "句型:We'd better+v.  我们最好……", "e": "We'd better leave now to make it on time.我们最好现在就出发 (这样)就能准时抵达了"}, {"w": "We may as well +verb/动词", "p": "wi meɪ æz wɛl", "m": "句型:We may as well+v.  我们不妨……", "e": "We may as well quit now.我们不妨现在就退出吧"}, {"w": "What can I do ______?", "p": "wʌt kæn aɪ duː", "m": "句型:what can I do+to do/that  问自己能做什么", "e": "What can I do to help complete the project?我该怎么做才能协助完成这个项目呢"}, {"w": "What if ____?", "p": "wʌt ɪf", "m": "句型:What if+clause?  如果……会怎样？", "e": "What if we cancel the class?如果我们取消课程会怎么样"}, {"w": "What I'm trying to say is ____ .", "p": "wʌt aɪm ˈtraɪɪŋ tu seɪ ɪz", "m": "句型:What I'm trying to say is+clause.  我想说的是……", "e": "What I'm trying to say is I think you can eat more healthy foods.我想说的是 我觉得你该多吃一些更健康的食品"}, {"w": "What's the matter with +verb-ing/动词-ing?", "p": "wʌts ðə ˈmætər wɪð", "m": "句型:what's the matter with+doing?  问某事有什么问题", "e": "What's the matter with eating a midnight snack?吃点儿宵夜会怎么样"}, {"w": "What would you do if +subject+verb? +主词+动词?", "p": "wʌt wʊd ju du ɪf", "m": "句型:What would you do if+subj.+v?  如果……你会怎么做？", "e": "What would you do if you got a flat tire?如果你遇到爆胎的情况 你会怎么做"}, {"w": "Who is +verb-ing/动词-ing?", "p": "huː ɪz", "m": "句型:who is+doing?  问谁正在做某事", "e": "Who is coming to play football?谁来踢球"}]</script>

<script>
  let vocab = JSON.parse(document.getElementById('vocab-data').textContent);
  const list = document.getElementById('word-list');
  const quizView = document.getElementById('quiz-view');
  const nbView = document.getElementById('notebook-view');
  const countEl = document.getElementById('count');

  /* ── 错题本存储（localStorage，按 单词+释义 作键） ── */
  const NB_KEY = 'oral-voc…book';
  const ADD_KEY = 'oral-vocab-added';
  const DRAWN_KEY = 'oral-vocab-drawn';
  function loadNB() { try { return JSON.parse(localStorage.getItem(NB_KEY)) || {}; } catch (e) { return {}; } }
  function saveNB(nb) { localStorage.setItem(NB_KEY, JSON.stringify(nb)); }
  function loadAdded() { try { return JSON.parse(localStorage.getItem(ADD_KEY)) || []; } catch (e) { return []; } }
  function saveAdded(a) { localStorage.setItem(ADD_KEY, JSON.stringify(a)); }
  function loadDrawn() { try { return JSON.parse(localStorage.getItem(DRAWN_KEY)) || []; } catch (e) { return []; } }
  function saveDrawn(d) { localStorage.setItem(DRAWN_KEY, JSON.stringify(d)); }
  function wordKey(v) { return v.w + '||' + v.m; }
  function normW(w) { return String(w).toLowerCase().replace(/\s+/g, ' ').trim(); }
  function mergeAdded() {
    const kept = [], seen = new Set(vocab.map(v => normW(v.w)));
    const base = loadAdded();
    base.forEach(a => {
      if (seen.has(normW(a.w))) return;
      seen.add(normW(a.w)); kept.push(a); vocab.push(a);
    });
    if (kept.length !== base.length) saveAdded(kept);
  }
  mergeAdded();
  function markUnknown(v) {
    const nb = loadNB(), k = wordKey(v);
    nb[k] = { w: v.w, p: v.p, m: v.m, e: v.e, n: (nb[k] ? nb[k].n : 0) + 1, t: Date.now() };
    saveNB(nb);
  }

  /* ── 列表模式（原有功能） ── */
  function listCountText() {
    const addedN = loadAdded().length;
    return '共 ' + vocab.length + ' 条' + (addedN ? '（含本地新增 ' + addedN + ' 条）' : '') + ' · 点击右侧按钮查看释义';
  }
  let toastTimer = null;
  function toast(msg) {
    let t = document.getElementById('toast');
    if (!t) { t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
  }
  function appendEntry(v, i) {
    const li = document.createElement('li');
    li.className = 'entry';
    li.innerHTML =
      '<div class="entry-main">' +
        '<span class="num">' + (i + 1) + '</span>' +
        '<span class="word"></span>' +
        '<button class="toggle" aria-expanded="false">详情</button>' +
      '</div>' +
      '<div class="detail">' +
        '<div class="phon"></div>' +
        '<div class="mean"></div>' +
        '<div class="ex"></div>' +
      '</div>';
    li.querySelector('.word').textContent = v.w;
    li.querySelector('.phon').textContent = v.p;
    li.querySelector('.mean').textContent = v.m;
    li.querySelector('.ex').textContent = v.e;
    const btn = li.querySelector('.toggle');
    btn.addEventListener('click', () => {
      const open = li.classList.toggle('open');
      btn.setAttribute('aria-expanded', open);
      btn.textContent = open ? '收起' : '详情';
    });
    list.appendChild(li);
  }
  vocab.forEach(appendEntry);

  /* ── 抽查模式：每轮 = 新词10（表尾最新、同周期不重复） + 最新错词10（可重复温故） ── */
  const NEW_SIZE = 10, WRONG_SIZE = 10, QUIZ_SIZE = 20;
  let quiz = { queue: [], idx: 0, wrong: [], right: 0, revealed: false, notice: '' };

  function startQuiz() {
    const drawn = new Set(loadDrawn());
    const usedKeys = new Set();
    // 错词槽：错题本中记录最新的前 10 条（错词允许跨轮重复抽取）
    const nbEntries = Object.values(loadNB()).sort((a, b) => (b.t || 0) - (a.t || 0));
    const wrongPicks = [];
    for (const e of nbEntries) {
      if (wrongPicks.length >= WRONG_SIZE) break;
      const k = wordKey(e);
      if (usedKeys.has(k)) continue;
      usedKeys.add(k); wrongPicks.push(e);
    }
    // 新词槽：积累本行号最大（最新录入）往前取未抽过的；错词不足 10 时新词补足到 20
    const need = QUIZ_SIZE - wrongPicks.length;
    let notice = '';
    let newPicks = [];
    function fillNew(skipDrawn) {
      newPicks = [];
      for (let i = vocab.length - 1; i >= 0 && newPicks.length < need; i--) {
        const v = vocab[i], k = wordKey(v);
        if (usedKeys.has(k) || (skipDrawn && drawn.has(k))) continue;
        newPicks.push(v); usedKeys.add(k);
      }
    }
    fillNew(true);
    if (newPicks.length < need && vocab.length > drawn.size) {
      saveDrawn([]);               // 本周期新词已抽完 → 自动清零重开
      drawn.clear();
      notice = '新词已抽完一轮，抽查记录自动重置';
      fillNew(true);
    } else if (newPicks.length < need) {
      fillNew(false);              // 积累本总数不足 20，允许重复补满
    }
    const rec = loadDrawn();
    newPicks.forEach(v => { const k = wordKey(v); if (!rec.includes(k)) rec.push(k); });
    saveDrawn(rec);
    const queue = newPicks.map(v => Object.assign({}, v, { _cat: 'new' }))
      .concat(wrongPicks.map(v => Object.assign({}, v, { _cat: 'wrong' })));
    quiz = { queue, idx: 0, wrong: [], right: 0, revealed: false, notice };
    if (notice) toast(notice);
    renderQuiz();
  }

  function footHtml() {
    const d = loadDrawn().length;
    return '<div class="quiz-foot"><span>本周期新词已抽 ' + d + ' / ' + vocab.length + '</span>' +
           '<button class="q-btn danger" id="q-reset">重置抽查记录</button></div>';
  }
  function bindFoot() {
    const b = quizView.querySelector('#q-reset');
    if (b) b.addEventListener('click', () => {
      if (confirm('重置后所有新词可再次被抽到（错题本记录不受影响）。确定重置？')) {
        saveDrawn([]); toast('已重置抽查记录'); startQuiz();
      }
    });
  }

  function renderQuiz() {
    if (quiz.idx >= quiz.queue.length) return renderResult();
    const v = quiz.queue[quiz.idx];
    quizView.innerHTML =
      '<div class="quiz-progress">第 ' + (quiz.idx + 1) + ' / ' + quiz.queue.length + ' 题</div>' +
      '<div class="quiz-card">' +
        '<span class="quiz-cat ' + v._cat + '">' + (v._cat === 'wrong' ? '最新错词' : '新词') + '</span>' +
        '<div class="quiz-word"></div>' +
        (quiz.revealed
          ? '<div class="quiz-detail"><div class="phon"></div><div class="mean"></div><div class="ex"></div></div>'
          : '') +
        '<div class="quiz-btns">' +
          (quiz.revealed
            ? '<button class="q-btn next" id="q-next">继续</button>'
            : '<button class="q-btn know" id="q-know">✅ 认识</button>' +
              '<button class="q-btn unknow" id="q-unknow">❌ 不认识</button>') +
        '</div>' +
      '</div>' + footHtml();
    quizView.querySelector('.quiz-word').textContent = v.w;
    if (quiz.revealed) {
      quizView.querySelector('.phon').textContent = v.p;
      quizView.querySelector('.mean').textContent = v.m;
      quizView.querySelector('.ex').textContent = v.e;
      quizView.querySelector('#q-next').addEventListener('click', nextQuestion);
    } else {
      quizView.querySelector('#q-know').addEventListener('click', () => { quiz.right++; nextQuestion(); });
      quizView.querySelector('#q-unknow').addEventListener('click', () => {
        markUnknown(v);
        quiz.wrong.push(v);
        quiz.revealed = true;
        renderQuiz();
      });
    }
    bindFoot();
  }
  function nextQuestion() { quiz.idx++; quiz.revealed = false; renderQuiz(); }

  function renderResult() {
    const nNew = quiz.queue.filter(q => q._cat === 'new').length;
    quizView.innerHTML =
      '<div class="quiz-card quiz-result">' +
        '<h2>本轮完成 🎉</h2>' +
        '<p>共 ' + quiz.queue.length + ' 题（新词 ' + nNew + ' + 错词 ' + (quiz.queue.length - nNew) + '）· 认识 ' + quiz.right + ' 个 · 不认识 ' + quiz.wrong.length + ' 个（已记入错题本）</p>' +
        (quiz.wrong.length
          ? '<ul id="q-wrong-list">' + quiz.wrong.map(v =>
              '<li><div class="w"></div><div class="m"></div></li>').join('') + '</ul>'
          : '') +
        '<div class="quiz-btns"><button class="q-btn next" id="q-again">再来一轮</button></div>' +
      '</div>' + footHtml();
    if (quiz.wrong.length) {
      const items = quizView.querySelectorAll('#q-wrong-list li');
      quiz.wrong.forEach((v, i) => {
        items[i].querySelector('.w').textContent = v.w;
        items[i].querySelector('.m').textContent = v.m;
      });
    }
    quizView.querySelector('#q-again').addEventListener('click', startQuiz);
    bindFoot();
  }

  /* ── 添加词语：字典自动填充 + 用户确认后写入（本地存储，写入前查重） ── */
  const OFFLINE_DICT = {
    'hang out': { p: '/hæŋ aʊt/', m: '短语：闲逛；消磨时间', e: 'We hang out after class. 我们课后常一起玩。' },
    'take after': { p: '/teɪk ˈɑːftə(r)/', m: '短语：（外貌或性格）像（长辈）', e: 'She takes after her mother. 她很像她母亲。' },
    'look forward to': { p: '/lʊk ˈfɔːwəd tu/', m: '短语：期待，盼望', e: "I look forward to your reply. 期待您的回复。" },
    'get along with': { p: '/ɡet əˈlɒŋ wɪð/', m: '短语：与……相处融洽；进展', e: 'We get along with our neighbors. 我们和邻居相处融洽。' },
    'in charge of': { p: '/ɪn tʃɑːdʒ əv/', m: '短语：负责，主管', e: "She's in charge of the project. 她负责这个项目。" },
    'on purpose': { p: '/ɒn ˈpɜːpəs/', m: '短语：故意地', e: 'He broke the cup on purpose. 他故意打碎了杯子。' },
    'no way': { p: '/nəʊ weɪ/', m: '口语：不可能；没门', e: 'No way! I can not believe it. 不可能！我没法相信。' },
    'my bad': { p: '/maɪ bæd/', m: '口语：我的错', e: "Oops, my bad. Sorry. 哎，我的错，抱歉。" },
    'got it': { p: '/ɡɒt ɪt/', m: '口语：明白了；收到了', e: 'Got it. I will handle it. 明白了，我来处理。' },
    'make sense': { p: '/meɪk sens/', m: '短语：有道理；讲得通', e: 'Your plan makes sense. 你的计划有道理。' },
    'up to you': { p: '/ˈʌp tə juː/', m: '口语：由你决定', e: "It's up to you. 由你决定。" },
    'kind of': { p: '/kaɪnd əv/', m: '短语：有点，稍微', e: "I'm kind of tired. 我有点累了。" },
  };
  function lookupOffline(w) {
    const r = OFFLINE_DICT[normW(w)];
    return r ? Object.assign({ source: 'offline' }, r) : null;
  }
  function parseYd(raw, w) {
    try {
      const d = typeof raw === 'string' ? JSON.parse(raw) : raw;
      const word = (d.ec && d.ec.word && d.ec.word[0]) || null;
      if (!word) return null;
      const phone = word.usphone || word.ukphone || '';
      const lines = [];
      const collect = trs => (trs || []).forEach(tr => {
        (tr.tr || []).forEach(t => {
          (t.l && t.l.i ? [].concat(t.l.i) : []).forEach(txt => {
            const s = String(txt).trim();
            if (s) lines.push(s);
          });
        });
      });
      collect(word.trs);
      const ex = (d.ec && d.ec['lexis-cd'] && d.ec['lexis-cd']['content']) || [];
      let example = '';
      const sent = (d.blng_sents_part && d.blng_sents_part['sent-pair']) || [];
      if (sent.length) {
        const s0 = sent[0];
        const en = (s0.en || '').trim(), zh = (s0.cn && s0.cn.trim) ? s0.cn.trim() : String(s0.cn || '').trim();
        if (en) example = en + (zh ? ' ' + zh : '');
      }
      const m = lines.length ? Array.from(new Set(lines)).join('；') : '';
      if (!m && !phone) return null;
      return { p: phone ? '/' + phone + '/' : '', m, e: example, source: 'youdao' };
    } catch (e) { return null; }
  }
  const YD_URL = w => 'https://dict.youdao.com/jsonapi?q=' + encodeURIComponent(w) +
    '&le=en&dicts=%7B%22count%22%3A99%2C%22ec%22%3A%7B%22charset%22%3A%22utf8%22%7D%2C' +
    '%22phrs%22%3A%7B%7D%2C%22blng_sents_part%22%3A%7B%7D%7D&client=web&keyfrom=webdict';
  async function lookupWord(w) {
    const off = lookupOffline(w);
    if (off) return off;
    const target = YD_URL(w);
    const urls = [
      'https://api.allorigins.win/raw?url=' + encodeURIComponent(target),
      'https://api.codetabs.com/v1/proxy/?quest=' + encodeURIComponent(target),
      'https://corsproxy.io/?url=' + encodeURIComponent(target),
    ];
    for (const u of urls) {
      try {
        const ctl = new AbortController();
        const timer = setTimeout(() => ctl.abort(), 8000);
        const r = await fetch(u, { signal: ctl.signal });
        clearTimeout(timer);
        if (!r.ok) continue;
        const hit = parseYd(await r.text(), w);
        if (hit) return hit;
      } catch (e) { /* 换下一个通道 */ }
    }
    return null;
  }
  const addMask = document.getElementById('add-mask');
  const addFields = ['add-w', 'add-p', 'add-m', 'add-e'].map(id => document.getElementById(id));
  const lookupBtn = document.getElementById('lookup-btn');
  function clearAutofill() { addFields.slice(1).forEach(f => f.classList.remove('autofill')); }
  function openAddModal() {
    addFields.forEach(f => f.value = '');
    clearAutofill();
    lookupBtn.disabled = false; lookupBtn.textContent = '查字典';
    addMask.hidden = false;
    addFields[0].focus();
  }
  async function doLookup() {
    const w = addFields[0].value.trim();
    if (!w) { toast('请先输入单词'); addFields[0].focus(); return; }
    if (vocab.some(v => normW(v.w) === normW(w))) {
      toast('「' + w + '」已在积累本中，无需添加'); return;
    }
    lookupBtn.disabled = true; lookupBtn.textContent = '查询中…';
    const r = await lookupWord(w);
    lookupBtn.disabled = false; lookupBtn.textContent = '查字典';
    if (!r) {
      toast('字典未收录该词（或网络不可达），可手动填写三项后确认'); return;
    }
    addFields[1].value = r.p; addFields[2].value = r.m; addFields[3].value = r.e;
    addFields.slice(1).forEach(f => f.classList.toggle('autofill', !!f.value));
    if (r.source === 'offline') toast('已从内置词库填充');
  }
  document.getElementById('btn-add').addEventListener('click', openAddModal);
  lookupBtn.addEventListener('click', () => { doLookup(); });
  addFields[0].addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); doLookup(); } });
  addFields.slice(1).forEach(f => f.addEventListener('input', () => f.classList.remove('autofill')));
  document.getElementById('add-cancel').addEventListener('click', () => { addMask.hidden = true; });
  addMask.addEventListener('click', e => { if (e.target === addMask) addMask.hidden = true; });
  document.getElementById('add-save').addEventListener('click', () => {
    const w = addFields[0].value.trim();
    if (!w) { toast('请先填写单词'); addFields[0].focus(); return; }
    if (!addFields[1].value.trim() && !addFields[2].value.trim() && !addFields[3].value.trim()) {
      toast('请至少填一项释义（可点「查字典」自动填充）'); return;
    }
    const nw = normW(w);
    if (vocab.some(v => normW(v.w) === nw)) {
      toast('「' + w + '」已在积累本中，未重复添加');
      addMask.hidden = true;
      return;
    }
    const entry = { w, p: addFields[1].value.trim(), m: addFields[2].value.trim(), e: addFields[3].value.trim() };
    saveAdded(loadAdded().concat([entry]));
    vocab.push(entry);
    appendEntry(entry, vocab.length - 1);
    addMask.hidden = true;
    toast('已添加：' + w + '（存于本浏览器，周五网页更新不会丢失）');
    if (!list.hidden) countEl.textContent = listCountText();
  });

  /* ── 错题本模式 ── */
  function renderNotebook() {
    const nb = loadNB();
    const entries = Object.values(nb).sort((a, b) => b.n - a.n);
    if (!entries.length) {
      nbView.innerHTML = '<div class="nb-empty">还没有错题 —— 去「抽查」模式点几个 ❌ 不认识吧</div>';
      return;
    }
    nbView.innerHTML =
      '<div class="nb-actions"><button class="q-btn unknow" id="nb-clear">清空错题本</button></div>' +
      '<ul id="nb-list" style="list-style:none;display:flex;flex-direction:column;gap:10px"></ul>';
    const ul = nbView.querySelector('#nb-list');
    entries.forEach(e => {
      const li = document.createElement('li');
      li.className = 'entry';
      li.innerHTML =
        '<div class="entry-main">' +
          '<span class="word"></span>' +
          '<span class="nb-count">✗ <span class="n"></span> 次</span>' +
          '<button class="toggle" aria-expanded="false">详情</button>' +
        '</div>' +
        '<div class="detail"><div class="phon"></div><div class="mean"></div><div class="ex"></div></div>';
      li.querySelector('.word').textContent = e.w;
      li.querySelector('.n').textContent = e.n;
      li.querySelector('.phon').textContent = e.p;
      li.querySelector('.mean').textContent = e.m;
      li.querySelector('.ex').textContent = e.e;
      const btn = li.querySelector('.toggle');
      btn.addEventListener('click', () => {
        const open = li.classList.toggle('open');
        btn.setAttribute('aria-expanded', open);
        btn.textContent = open ? '收起' : '详情';
      });
      ul.appendChild(li);
    });
    nbView.querySelector('#nb-clear').addEventListener('click', () => {
      if (confirm('确定清空错题本？此操作不可恢复。')) { localStorage.removeItem(NB_KEY); renderNotebook(); }
    });
  }

  /* ── 模式切换 ── */
  const modeBtns = document.querySelectorAll('.mode-btn');
  function setMode(mode) {
    modeBtns.forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
    list.hidden = quizView.hidden = nbView.hidden = true;
    if (mode === 'list') {
      list.hidden = false;
      countEl.textContent = listCountText();
    } else if (mode === 'quiz') {
      quizView.hidden = false;
      countEl.textContent = '每轮 = 新词 10 + 最新错词 10 · 新词同一周期内严格不重复';
      startQuiz();
    } else {
      nbView.hidden = false;
      const nb = loadNB();
      countEl.textContent = '错题本 · 共 ' + Object.keys(nb).length + ' 个词 · 按不认识次数排序';
      renderNotebook();
    }
  }
  modeBtns.forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));
  countEl.textContent = listCountText();
</script>
</body>
</html>
